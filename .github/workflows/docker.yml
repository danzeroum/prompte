name: Docker

# Valida que as imagens Docker realmente buildam e que o compose é válido (sem publicar).
on:
  push:
    branches: ['**']
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'db/**'
      - 'ops/**'
      - '.github/workflows/docker.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'api/**'
      - 'db/**'
      - 'ops/**'
      - '.github/workflows/docker.yml'

jobs:
  build-frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image (nginx)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: prompte-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image (Fastify)
        uses: docker/build-push-action@v6
        with:
          context: api
          push: false
          tags: prompte-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  validate-selfhost-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ops/docker-compose.selfhost.yml
        run: |
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci JWT_SECRET=ci \
          DOMAIN=example.com ACME_EMAIL=ci@example.com \
          docker compose -f ops/docker-compose.selfhost.yml config >/dev/null
