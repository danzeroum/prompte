# Configuração de deploy no Netlify (Fase E).
# O app fica em frontend/, então o build roda nesse diretório e publica frontend/dist.
#
# As variáveis VITE_* são PÚBLICAS por design (vão no bundle; a proteção é a RLS).
# Ainda assim, por higiene (recomendação M3) elas NÃO ficam mais versionadas aqui:
# configure-as no painel do Netlify em Site settings → Environment variables:
#   VITE_SUPABASE_URL       = https://<seu-projeto>.supabase.co
#   VITE_SUPABASE_ANON_KEY  = <sua anon/publishable key>
# O Vite as injeta no bundle em tempo de build. Para um build local/turnkey,
# use o frontend/.env.example como referência (cp .env.example .env).

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cabeçalhos de cache: o frontend/public/_headers (copiado para dist) já define
# Cache-Control imutável para /assets e no-cache para os HTML. O Netlify lê o
# arquivo _headers automaticamente, então não duplicamos aqui.
