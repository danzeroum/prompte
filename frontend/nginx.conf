# Cabeçalhos de segurança (recomendação M4). Complementam a CSP definida via
# <meta http-equiv> nos HTMLs. Atenção ao nginx: um `add_header` dentro de um
# `location` substitui TODOS os herdados, por isso repetimos os headers de
# segurança em cada bloco que define seus próprios headers de cache.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Headers de segurança no nível do server (herdados onde não há add_header local).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Assets com hash (gerados pelo Vite): cache imutável.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  # HTML e manifest: sempre revalidar.
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
  location = /manifest.json {
    add_header Cache-Control "no-cache" always;
  }
  # Service worker nunca deve ser cacheado.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }

  # App multi-página estático (sem fallback SPA).
  location / {
    try_files $uri $uri/ =404;
  }
}
