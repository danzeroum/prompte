<div class="app">
  <!-- ÍNDICE -->
  <aside class="idx">
    <div class="idx-brand">
      <span class="idx-mark">p</span>
      <div><b>prompte</b><span>telas sistêmicas</span></div>
    </div>

    <div class="idx-sec">Telas novas</div>
    <button class="idx-item" data-screen="prompt-detail"><svg class="ic"><use href="#i-library"/></svg> Detalhe do prompt</button>
    <button class="idx-item" data-screen="onboarding"><svg class="ic"><use href="#i-bolt"/></svg> Onboarding</button>
    <button class="idx-item" data-screen="prefs"><svg class="ic"><use href="#i-sliders"/></svg> Preferências</button>
    <button class="idx-item" data-screen="admin"><svg class="ic"><use href="#i-chart"/></svg> Admin (dashboard)</button>
    <button class="idx-item" data-screen="manual"><svg class="ic"><use href="#i-book"/></svg> Manual (refino)</button>
    <button class="idx-item" data-screen="navmobile"><svg class="ic"><use href="#i-phone"/></svg> Nav mobile</button>
    <button class="idx-item" data-screen="chat"><svg class="ic"><use href="#i-message"/></svg> Chat / assistente</button>

    <div class="idx-sec">Conta / Perfil</div>
    <button class="idx-item on" data-screen="auth-out"><svg class="ic"><use href="#i-mail"/></svg> Entrar (deslogado)</button>
    <button class="idx-item" data-screen="auth-sent"><svg class="ic"><use href="#i-check-circle"/></svg> Link enviado</button>
    <button class="idx-item" data-screen="auth-verify"><svg class="ic"><use href="#i-clock"/></svg> Verificando</button>
    <button class="idx-item" data-screen="auth-in"><svg class="ic"><use href="#i-user"/></svg> Logado</button>
    <button class="idx-item" data-screen="auth-expired"><svg class="ic"><use href="#i-shield"/></svg> Sessão expirada</button>

    <div class="idx-sec">Kit de estados</div>
    <button class="idx-item" data-screen="st-empty"><svg class="ic"><use href="#i-library"/></svg> Vazio (empty)</button>
    <button class="idx-item" data-screen="st-loading"><svg class="ic"><use href="#i-gauge"/></svg> Carregando (skeleton)</button>
    <button class="idx-item" data-screen="st-error"><svg class="ic"><use href="#i-alert"/></svg> Erro + retry</button>
    <button class="idx-item" data-screen="st-404"><svg class="ic"><use href="#i-compass"/></svg> 404 / rota inválida</button>
    <button class="idx-item" data-screen="st-offline"><svg class="ic"><use href="#i-wifi-off"/></svg> Offline</button>
    <button class="idx-item" data-screen="st-rate"><svg class="ic"><use href="#i-clock"/></svg> Rate limit (429)</button>
    <button class="idx-item" data-screen="st-toasts"><svg class="ic"><use href="#i-info"/></svg> Toasts</button>
  </aside>

  <!-- CANVAS -->
  <main class="canvas">
    <div class="canvas-bar">
      <div class="canvas-title">
        <h1 id="cTitle">Entrar</h1>
        <p id="cDesc">Conta / Perfil · estado deslogado</p>
      </div>
      <div class="canvas-tools">
        <div class="seg" id="device">
          <button data-dev="desktop" class="on"><svg class="ic"><use href="#i-monitor"/></svg> Desktop</button>
          <button data-dev="mobile"><svg class="ic"><use href="#i-phone"/></svg> Mobile</button>
        </div>
        <button class="pe-icon-btn" id="themeBtn" aria-label="Alternar tema"><svg class="ic"><use href="#i-sun"/></svg></button>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="frame">
        <div class="fr-top">
          <span class="mk">p</span><b>prompte</b><span class="sp"></span>
          <button class="pe-icon-btn" aria-label="tema"><svg class="ic"><use href="#i-moon"/></svg></button>
          <span class="pe-chip" id="frChip" style="display:none"></span>
        </div>
        <div class="fr-body" id="frBody"><!-- screens injected --></div>
      </div>
    </div>
  </main>
</div>

<script src="telas-sistemicas/screens.js"></script>
</body>
</html>
