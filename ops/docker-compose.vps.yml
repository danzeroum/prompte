# Deploy do frontend estático na VPS, com HTTPS automático (Caddy + Let's Encrypt).
# O backend é o Supabase na nuvem — nada de banco/Edge Functions roda aqui.
#
# Uso:
#   cp ops/.env.example ops/.env   # preencha DOMAIN e ACME_EMAIL
#   docker compose --env-file ops/.env -f ops/docker-compose.vps.yml up -d --build
#
# Pré-requisitos: registro DNS A do DOMAIN apontando para o IP da VPS;
# portas 80 e 443 liberadas no firewall.

services:
  frontend:
    build:
      context: ../frontend
      # As VITE_* são públicas; sobrescreva aqui só se apontar p/ outro projeto Supabase.
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: prompt-engineering-pro
    restart: unless-stopped
    expose:
      - "80" # acessível só dentro da rede do compose; quem expõe é o Caddy
    networks: [web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [frontend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no ops/.env}
      ACME_EMAIL: ${ACME_EMAIL:?defina ACME_EMAIL no ops/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]

networks:
  web:

volumes:
  caddy_data: # certificados TLS persistidos (não perder entre deploys)
  caddy_config:
