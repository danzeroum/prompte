# Executa o Supabase CLI em container, autenticando por Personal Access Token
# (sem login interativo). Defina SUPABASE_ACCESS_TOKEN no ambiente antes de rodar.
#
#   export SUPABASE_ACCESS_TOKEN=sbp_xxx
#   docker compose run --rm supabase-cli secrets list --project-ref <ref>
services:
  supabase-cli:
    build: .
    image: supabase-cli
    environment:
      - SUPABASE_ACCESS_TOKEN=${SUPABASE_ACCESS_TOKEN}
    # Monta o diretório atual em /workspace (útil para migrations/config locais).
    volumes:
      - ./:/workspace
    working_dir: /workspace
